<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Garden</title>
    <meta name="description" content="放置癒し系3Dピクセルアイソメデモ — 浮遊島でのんびり暮らすキャラを眺めよう" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Segoe UI', sans-serif;
      }
      canvas { display: block; }

      /* ===== Context Menu ===== */
      #ctx-menu {
        display: none;
        position: fixed;
        z-index: 100;
        background: rgba(15, 15, 30, 0.92);
        border: 1px solid rgba(120, 200, 255, 0.25);
        border-radius: 10px;
        padding: 8px 0;
        min-width: 200px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        color: #e0eeff;
        font-size: 13px;
        user-select: none;
      }
      #ctx-menu.visible { display: block; }

      .ctx-section {
        padding: 4px 0;
        border-bottom: 1px solid rgba(120,200,255,0.12);
      }
      .ctx-section:last-child { border-bottom: none; }

      .ctx-label {
        padding: 4px 14px 2px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(120,200,255,0.55);
      }

      .ctx-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        cursor: pointer;
        transition: background 0.12s;
        border-radius: 4px;
        margin: 0 4px;
      }
      .ctx-item:hover { background: rgba(120,200,255,0.12); }
      .ctx-item.active {
        color: #7de8ff;
        font-weight: 600;
      }
      .ctx-item.active::before {
        content: '✦';
        font-size: 9px;
        color: #7de8ff;
      }
      .ctx-item:not(.active)::before { content: ''; width: 9px; }
      .ctx-item.locked {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .ctx-item.locked:hover { background: none; }

      /* ===== Unlock toast ===== */
      #unlock-toast {
        display: none;
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15,15,30,0.9);
        border: 1px solid rgba(120,200,255,0.3);
        border-radius: 8px;
        padding: 10px 20px;
        color: #7de8ff;
        font-size: 13px;
        z-index: 200;
        pointer-events: none;
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <div id="ctx-menu"></div>
    <div id="unlock-toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
